# Local PostgreSQL for the Mailbox Order Manager.
# Start with: docker compose up -d
# Then: cp .env.example .env && npx prisma migrate dev && npm run db:seed
services:
  postgres:
    image: postgres:16-alpine
    container_name: mailbox-postgres
    environment:
      POSTGRES_USER: mailbox_app
      POSTGRES_PASSWORD: mailbox_dev
      POSTGRES_DB: mailbox_dev
    ports:
      - "5432:5432"
    volumes:
      - mailbox-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailbox_app -d mailbox_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mailbox-data:
